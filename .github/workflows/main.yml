name: Deploy Unity Build to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: linux-server.zip
      DEPLOY_PATH: ~/deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Check if Build Exists
        run: |
          if [ ! -f builds/${{ env.ZIP_NAME }} ]; then
            echo "❌ Build ZIP no encontrado. Asegúrate de que 'builds/${{ env.ZIP_NAME }}' existe antes de hacer push."
            exit 1
          fi

      - name: Upload Build to Server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "builds/${{ env.ZIP_NAME }}"
          target: ${{ env.DEPLOY_PATH }}

      - name: Unzip and Restart Service via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ${{ env.DEPLOY_PATH }}
            unzip -o ${{ env.ZIP_NAME }} -d LinuxServer
            chmod +x LinuxServer/TekenCombat2.x86_64
            sudo systemctl restart tekencombat.service
