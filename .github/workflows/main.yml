name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]  # ← lo lanza Unity Cloud con Webhook
  workflow_dispatch:               # ← puedes lanzarlo tú desde GitHub o curl

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar último build de Unity Cloud
      env:
        UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
        ORG_ID:          ${{ secrets.ORG_ID }}
        PROJECT_ID:      ${{ secrets.PROJECT_ID }}
        BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
      run: |
        echo "� Descargando build desde Unity Cloud Build..."
        curl -sL -H "Authorization: Bearer $UNITY_API_TOKEN" \
          "https://build-api.cloud.unity3d.com/api/v1/orgs/$ORG_ID/projects/$PROJECT_ID/buildtargets/$BUILD_TARGET/builds/latest/download" \
          --output servidor.zip
        echo "� Descomprimiendo..."
        unzip servidor.zip -d build/

    - name: Subir build al VPS
      uses: appleboy/scp-action@v0.1.5
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        source:   "build/**"
        target:   "/home/${{ secrets.SERVER_USER }}/server"

    - name: Reiniciar servidor
      uses: appleboy/ssh-action@v1.0.0
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "♻️ Reiniciando servicio del juego..."
          sudo systemctl restart mygame-server
