name: Deploy Unity Server (auto desde Cloud Build)

on:
  push:
    branches: [ main ]

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
      # 0) Prepara el runner
      - name: Preparar runner (instalar jq y unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # 1) Obtener info del último build exitoso
      - name: Listar y extraer URL del último build exitoso
        id: fetch_build
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UNITY_API_TOKEN" | base64)
          echo "� Listando builds exitosos..."
          builds_json=$(curl -s -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds")

          latest=$(jq 'map(select(.buildStatus=="success")) | max_by(.build) | .build' <<<"$builds_json")
          echo "✔ Build exitoso más reciente: #$latest"
          download_url=$(jq -r \
            '.[] | select(.buildStatus=="success" and .build == '"$latest"') | .links.download_primary.href' \
            <<<"$builds_json")

          if [[ -z "$download_url" || "$download_url" == "null" ]]; then
            echo "❌ No se pudo extraer la URL de descarga." >&2
            exit 1
          fi
          echo "⬇️  URL: $download_url"

          # Exportar variables al entorno
          echo "LATEST=$latest" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$download_url" >> $GITHUB_ENV

      # 2) Desplegar en Windows via WinRM
      - name: Deploy en servidor Windows
        uses: busypeoples/winrm-action@v1.0.2
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            $ErrorActionPreference = 'Stop'
            Write-Host "� Build#: $env:LATEST"
            Write-Host "� Limpiando C:\server..."
            Remove-Item -Recurse -Force C:\server\*

            Write-Host "⬇️  Descargando artefacto..."
            Invoke-WebRequest -Uri "$env:DOWNLOAD_URL" -OutFile C:\server\server.zip

            Write-Host "� Descomprimiendo..."
            Expand-Archive -Path C:\server\server.zip -DestinationPath C:\server\ -Force
            Remove-Item C:\server\server.zip

            Write-Host "� Reiniciando servicio 'mygame-server'..."
            Restart-Service -Name mygame-server -Force

            Write-Host "✅ Despliegue completado."
