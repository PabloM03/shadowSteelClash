name: Deploy Unity Server (auto desde Cloud Build)

on:
  push:
    branches: [ main ]

jobs:
  deploy-server:
    runs-on: [ self-hosted, windows ]

    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
      # 1) Obtener info del último build exitoso (PowerShell)
      - name: Obtener último build exitoso
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Preparar autenticación
          $token = $Env:UNITY_API_TOKEN
          $auth  = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$token:"))

          Write-Host "� Listando builds exitosos..."
          $apiUrl = "https://build-api.cloud.unity3d.com/api/v1/orgs/$($Env:ORG_ID)/projects/$($Env:PROJECT_ID)/buildtargets/$($Env:BUILD_TARGET)/builds"
          $builds = Invoke-RestMethod -Headers @{ Authorization = "Basic $auth" } -Uri $apiUrl -UseBasicParsing

          # Filtrar solo los exitosos y extraer el mayor número de build
          $successes = $builds | Where-Object buildStatus -EQ 'success'
          if (-not $successes) {
            throw "No hay builds exitosos."
          }
          $latest = ($successes | Measure-Object -Property build -Maximum).Maximum
          $downloadUrl = ($successes | Where-Object build -EQ $latest).links.download_primary.href

          Write-Host "✔ Build exitoso más reciente: #$latest"
          # Exportar variables para pasos posteriores
          Add-Content -Path $Env:GITHUB_ENV -Value "LATEST=$latest"
          Add-Content -Path $Env:GITHUB_ENV -Value "DOWNLOAD_URL=$downloadUrl"

      # 2) Desplegar en self-hosted Windows runner
      - name: Desplegar en Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = $Env:LATEST
          $url    = $Env:DOWNLOAD_URL
          $dest   = 'C:\server'

          Write-Host "� Desplegando build #$latest"
          if (Test-Path $dest) {
            Write-Host "� Limpiando carpeta $dest..."
            Remove-Item -Recurse -Force "$dest\*" 
          } else {
            Write-Host "� Creando carpeta $dest..."
            New-Item -ItemType Directory -Path $dest | Out-Null
          }

          Write-Host "⬇️  Descargando artefacto..."
          Invoke-WebRequest -Uri $url -OutFile "$dest\server.zip" -UseBasicParsing

          Write-Host "� Descomprimiendo..."
          Expand-Archive -Path "$dest\server.zip" -DestinationPath $dest -Force
          Remove-Item "$dest\server.zip"

          Write-Host "� Reiniciando servicio 'mygame-server'..."
          Restart-Service -Name mygame-server -Force

          Write-Host "✅ Despliegue completado."
