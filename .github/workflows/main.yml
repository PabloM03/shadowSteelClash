name: Deploy Linux Server Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ZIP_NAME: linux-server.zip
  BUILD_DIR: builds
  DEPLOY_PATH: /home/${{ secrets.SERVER_USER }}/deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Zip the build folder
        run: |
          echo "📦 Empaquetando build..."
          cd ${{ env.BUILD_DIR }}
          zip -r ../${{ env.ZIP_NAME }} ./*
          cd ..

      - name: Calculate local checksum
        run: sha256sum ${{ env.ZIP_NAME }} | awk '{print $1}' > local_checksum.txt

      # ✅ Verificar si existe el checksum remoto
      - name: Check if remote checksum exists
        id: check_remote
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            if [ -f "${{ env.DEPLOY_PATH }}/remote_checksum.txt" ]; then
              echo "CHECKSUM_EXISTS=true" >> /tmp/env_export
            else
              echo "CHECKSUM_EXISTS=false" >> /tmp/env_export
            fi
            cat /tmp/env_export
        continue-on-error: true

      - name: Set output flag for checksum
        id: flags
        run: |
          CHECKSUM_EXISTS=$(grep CHECKSUM_EXISTS /tmp/env_export | cut -d'=' -f2)
          echo "checksum_exists=$CHECKSUM_EXISTS" >> $GITHUB_OUTPUT

      # ✅ Solo si existe el checksum remoto, lo descargamos
      - name: Download remote checksum
        if: steps.flags.outputs.checksum_exists == 'true'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "${{ env.DEPLOY_PATH }}/remote_checksum.txt"
          target: "."

      # ✅ Solo si existe el checksum remoto, comparamos
      - name: Compare checksums
        id: compare
        if: steps.flags.outputs.checksum_exists == 'true'
        run: |
          LOCAL=$(cat local_checksum.txt)
          REMOTE=$(cat remote_checksum.txt || echo "NO_REMOTE_FILE")
          echo "🔍 Local:  $LOCAL"
          echo "🔍 Remote: $REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ El build es idéntico. No se despliega."
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
            echo "🚀 El build ha cambiado. Se desplegará."
          fi

      # ✅ Subir siempre si no hay checksum. O si hay y ha cambiado.
      - name: Upload ZIP and checksum
        if: steps.flags.outputs.checksum_exists == 'false' || steps.compare.outputs.skip_deploy == 'false'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: |
            linux-server.zip
            local_checksum.txt
          target: "${{ env.DEPLOY_PATH }}"

      # ✅ Reemplazar y reiniciar siempre si no hay checksum o si hay cambios
      - name: Unzip and restart service
        if: steps.flags.outputs.checksum_exists == 'false' || steps.compare.outputs.skip_deploy == 'false'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "📂 Creando carpeta si no existe..."
            mkdir -p ${{ env.DEPLOY_PATH }}/LinuxServer
            echo "🗃️  Desempaquetando build..."
            unzip -o ${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }} -d ${{ env.DEPLOY_PATH }}/LinuxServer
            echo "🔒 Dando permisos al ejecutable..."
            chmod +x ${{ env.DEPLOY_PATH }}/LinuxServer/TekenCombat2.x86_64
            echo "🔁 Reiniciando servicio..."
            sudo systemctl restart tekencombat.service
            sudo systemctl status tekencombat.service --no-pager
            echo "💾 Guardando checksum remoto..."
            mv ${{ env.DEPLOY_PATH }}/local_checksum.txt ${{ env.DEPLOY_PATH }}/remote_checksum.txt
