name: Deploy Linux Server Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_DIR: builds
  SERVICE_PATH: /home/${{ secrets.SERVER_USER }}/tekencombat
  EXECUTABLE: TekenCombat2.x86_64

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Subir SOLO el contenido de builds/ (sin la carpeta builds)
      - name: Upload Unity build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.BUILD_DIR }}/**"
          target: "${{ env.SERVICE_PATH }}"

      # Dar permisos de ejecución y reiniciar el servicio
      - name: Restart Unity service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Asegurarse de que existe el ejecutable
            ls -l ${{ env.SERVICE_PATH }}
            sudo chmod +x ${{ env.SERVICE_PATH }}/${{ env.EXECUTABLE }}
            sudo systemctl daemon-reload
            sudo systemctl restart tekencombat.service
            sudo systemctl status --no-pager tekencombat.service
