name: Deploy Existing Unity Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: builds
      ZIP_NAME: linux-server.zip
      DEPLOY_PATH: ~/deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify build exists
        run: |
          if [ ! -f "${BUILD_DIR}/TekenCombat2.x86_64" ]; then
            echo "❌ No existe el ejecutable en ${BUILD_DIR}/TekenCombat2.x86_64"
            exit 1
          fi

      - name: Prepare LinuxServer folder for zip
        run: |
          mkdir -p temp/LinuxServer
          cp -r ${BUILD_DIR}/TekenCombat2.x86_64 temp/LinuxServer/
          cp -r ${BUILD_DIR}/UnityPlayer.so temp/LinuxServer/
          cp -r ${BUILD_DIR}/libdecor-0.so.0 temp/LinuxServer/
          cp -r ${BUILD_DIR}/libdecor-cairo.so temp/LinuxServer/
          cp -r ${BUILD_DIR}/TekenCombat2_Data temp/LinuxServer/
          cp -r "${BUILD_DIR}/ShadowSteel clash_BurstDebugInformation_DoNotShip" temp/LinuxServer/

      - name: Create ZIP of build
        run: |
          cd temp
          zip -r $ZIP_NAME LinuxServer
          mv $ZIP_NAME ../${BUILD_DIR}/

      - name: Upload to server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "${{ env.BUILD_DIR }}/${{ env.ZIP_NAME }}"
          target: "${{ env.DEPLOY_PATH }}"

      - name: Restart systemd service via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            unzip -o ~/deploy/${{ env.ZIP_NAME }} -d ~/deploy/
            chmod +x ~/deploy/LinuxServer/TekenCombat2.x86_64
            sudo systemctl restart tekencombat.service
