name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: windows-2019

    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
    # 0) Obtener el código
    - uses: actions/checkout@v3

    # 1) Asegurar jq (si ya está, choco termina con código 0)
    - name: Ensure jq
      shell: powershell
      run: choco install jq -y --no-progress

    # 2) Mantener solo el último build SUCCESS en Cloud Build
    - name: Clean Cloud-Build artifacts
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $api = "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds"
        $all = Invoke-RestMethod -Uri $api -Headers @{Authorization="Basic $env:UNITY_API_TOKEN"}
        $list = $all | Where-Object { $_.buildStatus -eq "success" } | ForEach-Object { $_.build } | Sort-Object
        if ($list) {
          $latest = $list[-1]
          foreach ($n in $list) {
            if ($n -ne $latest) {
              Invoke-RestMethod -Method Delete -Uri "$api/$n/artifacts" -Headers @{Authorization="Basic $env:UNITY_API_TOKEN"}
            }
          }
        }

    # 3) Obtener la URL del último build SUCCESS
    - name: Get last build URL
      id: url
      shell: bash
      env:
        UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
        ORG_ID:          ${{ secrets.ORG_ID }}
        PROJECT_ID:      ${{ secrets.PROJECT_ID }}
        BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
      run: |
        set -euo pipefail
        API="https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds"
        JSON=$(curl -s -H "Authorization: Basic ${UNITY_API_TOKEN}" "$API")
        LAST=$(echo "$JSON" | jq 'map(select(.buildStatus=="success")) | max_by(.build) | .build')
        [ "$LAST" = "null" ] && { echo "::warning::No successful build."; exit 0; }
        DL=$(echo "$JSON" | jq -r --arg n "$LAST" '.[] | select(.buildStatus=="success" and (.build|tostring)==$n) | .links.download_primary.href')
        echo "download_url=$DL" >> "$GITHUB_OUTPUT"
        echo "✔  build #$LAST → $DL"

    # 4) Despliegue remoto en Windows (WinRM) – URL llega vía env
    - name: Deploy & restart on Windows
      uses: im-open/remote-windows-machine-script-execution@v2.1.0
      with:
        server:                   ${{ secrets.SERVER_IP }}
        service-account-id:       ${{ secrets.SERVER_USER }}
        service-account-password: ${{ secrets.SERVER_PASSWORD }}
        script-path:              .github/scripts/deploy.ps1   # tu script versionado
        script-arguments:         ""                           # vacío → la acción NO añade -split
      env:
        DOWNLOAD_URL: ${{ steps.url.outputs.download_url }}    # leído en deploy.ps1 como $env:DOWNLOAD_URL
