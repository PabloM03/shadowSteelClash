name: Deploy Linux Server Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_DIR: builds
  DEPLOY_PATH: /home/${{ secrets.SERVER_USER }}/deploy
  SERVICE_PATH: /home/${{ secrets.SERVER_USER }}/tekencombat
  EXECUTABLE: TekenCombat2.x86_64

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Subir build al servidor en carpeta temporal
      - name: Upload Unity build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.BUILD_DIR }}/*"
          target: "${{ env.DEPLOY_PATH }}"

      # Mover build, dar permisos y reiniciar servicio
      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl stop tekencombat.service || true
            rm -rf ${{ env.SERVICE_PATH }}/*
            cp -r ${{ env.DEPLOY_PATH }}/* ${{ env.SERVICE_PATH }}/
            sudo chmod +x ${{ env.SERVICE_PATH }}/${{ env.EXECUTABLE }}
            sudo systemctl daemon-reload
            sudo systemctl start tekencombat.service
