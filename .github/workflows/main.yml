name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
    - name: Limpiar artefactos antiguos en Unity Cloud Build
      env:
        UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
        ORG_ID:          ${{ secrets.ORG_ID }}
        PROJECT_ID:      ${{ secrets.PROJECT_ID }}
        BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
      run: |
        set -e
        echo "� Eliminando artefactos de builds antiguos en Unity Cloud Build..."
        AUTH=$(echo -n "${UNITY_API_TOKEN}:" | base64)
        curl -s -X DELETE \
          -H "Authorization: Basic $AUTH" \
          "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds/artifacts"

    - name: Descargar build de Unity Cloud
      env:
        UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
        ORG_ID:          ${{ secrets.ORG_ID }}
        PROJECT_ID:      ${{ secrets.PROJECT_ID }}
        BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
      run: |
        set -e
        echo "� Autenticando en Unity Cloud Build..."
        AUTH=$(echo -n "${UNITY_API_TOKEN}:" | base64)

        echo "� Listando builds con estado 'success'..."
        builds_json=$(curl -s \
          -H "Authorization: Basic $AUTH" \
          "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds")

        latest=$(jq 'map(select(.buildStatus=="success") | .build) | max' <<<"$builds_json")
        echo "✔ Build exitoso más reciente: #${latest}"

        echo "� Extrayendo URL de descarga del build #${latest}..."
        download_url=$(jq -r \
          '.[] | select(.build=='"$latest"') | .links.download_primary.href' \
          <<<"$builds_json")

        if [[ -z "$download_url" || "$download_url" == "null" ]]; then
          echo "❌ No se pudo extraer la URL de descarga para el build #${latest}."
          exit 1
        fi

        echo "✅ URL de descarga (build #${latest}):"
        echo "$download_url"

        echo "� Limpiando workspace local ./build/..."
        rm -rf build/ servidor.zip
        mkdir -p build

        echo "⬇️ Descargando artefacto..."
        curl -sL "$download_url" -o servidor.zip

        echo "�️ Descomprimiendo en ./build/..."
        unzip -o servidor.zip -d build/

    - name: Limpiar build anterior en el VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "� Limpiando carpeta remota /home/${{ secrets.SERVER_USER }}/server..."
          rm -rf /home/${{ secrets.SERVER_USER }}/server/*

    - name: Subir build al VPS
      uses: appleboy/scp-action@v0.1.5
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        source:   "build/**"
        target:   "/home/${{ secrets.SERVER_USER }}/server"

    - name: Reiniciar servicio
      uses: appleboy/ssh-action@v1.0.0
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "� Reiniciando servicio en el VPS..."
          sudo systemctl restart mygame-server
          echo "✅ Servicio reiniciado."
