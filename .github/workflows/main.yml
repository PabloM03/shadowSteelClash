name: Build & Deploy Unity 6 (Linux runner con Builder)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest    # ⚠️ Unity Builder usa Docker, mejor en Linux

    steps:
    - uses: actions/checkout@v3

    # Unity Builder se encarga de todo: instalar Unity, activar, compilar
    - name: Build headless server
      uses: game-ci/unity-builder@v4
      env:
        UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_SERIAL:   ${{ secrets.UNITY_SERIAL }}   # o usa UNITY_LICENSE si es Floating
      with:
        unityVersion:    6000.0.29f1
        targetPlatform:  LinuxHeadless         # o StandaloneWindows64 según destino
        buildMethod:     BuildScript.PerformServerBuild
        allowDirtyBuild: true                  # si no haces commit antes del build

    # Crea artefacto de salida (opcional)
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: server-build
        path: build/**

    # Sube al servidor VPS
    - name: Upload build to VPS
      uses: appleboy/scp-action@v0.1.5
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        source:   "build/**"
        target:   "/home/${{ secrets.SERVER_USER }}/server"

    - name: Restart game service
      uses: appleboy/ssh-action@v1.0.0
      with:
        host:     ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key:      ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          sudo systemctl restart mygame-server
