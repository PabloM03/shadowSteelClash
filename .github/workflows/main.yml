name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      # 1) Instala jq para parsear JSON
      - name: Preparar runner
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 2) Averigua el último build exitoso y su URL
      - name: Obtener último build exitoso
        id: unity
        env:
          UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
          ORG_ID:          ${{ secrets.ORG_ID }}
          PROJECT_ID:      ${{ secrets.PROJECT_ID }}
          BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UNITY_API_TOKEN" | base64)
          builds=$(curl -s -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds")
          latest=$(jq 'map(select(.buildStatus=="success")) | map(.build) | max' <<<"$builds")
          url=$(jq -r \
            '.[] | select(.buildStatus=="success" and .build=='"$latest"') | .links.download_primary.href' \
            <<<"$builds")
          echo "::set-output name=number::$latest"
          echo "::set-output name=url::$url"

      # 3) Conéctate por WinRM y desplegar en Windows
      - name: Desplegar en Windows vía WinRM
        uses: appleboy/psrp-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          user: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}   # o usa un Secret distinto
          script: |
            $ErrorActionPreference = 'Stop'

            $deployDir = "C:\server"
            $buildDir  = "$deployDir\build"
            $zipFile   = "$deployDir\servidor.zip"
            $svcName   = "ShadowSteelClashServer"

            # Si es la primera vez, instala unzip (choco) y registra el servicio con NSSM
            if (!(Test-Path $buildDir)) {
              Write-Host "⚙️ Primera vez: creando directorios e instalando unzip..."
              New-Item $buildDir -ItemType Directory | Out-Null

              # Si no tienes Chocolatey, instala:
              if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
                Set-ExecutionPolicy Bypass -Scope Process -Force
                iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
              }
              choco install unzip -y

              # Descarga y registra NSSM
              $nssmZip = "$deployDir\nssm.zip"
              (New-Object System.Net.WebClient).DownloadFile(
                'https://nssm.cc/release/nssm-2.24.zip', $nssmZip)
              Expand-Archive $nssmZip "$deployDir\nssm"
              $nssmExe = "$deployDir\nssm\win64\nssm.exe"

              # Crea el servicio Windows con NSSM
              & $nssmExe install $svcName "$buildDir\windows-server.exe"
              & $nssmExe set $svcName DisplayName "Servidor Unity ShadowSteelClash"
              & $nssmExe set $svcName AppDirectory "$buildDir"
              & $nssmExe set $svcName Start SERVICE_AUTO_START
            }

            # 4) Descarga y sobreescribe el último build
            Write-Host "⬇️  Bajando build #${{ steps.unity.outputs.number }}..."
            Invoke-WebRequest -Uri "${{ steps.unity.outputs.url }}" -OutFile $zipFile

            Write-Host "� Descomprimiendo..."
            Remove-Item "$buildDir\*" -Recurse -Force
            Expand-Archive $zipFile $buildDir -Force

            # 5) Arranca o reinicia el servicio
            Write-Host "� Reiniciando servicio..."
            if (Get-Service $svcName -ErrorAction SilentlyContinue) {
              Restart-Service $svcName -Force
            } else {
              Start-Service $svcName
            }
            Write-Host "✅ Servicio $svcName está $(Get-Service $svcName)."
