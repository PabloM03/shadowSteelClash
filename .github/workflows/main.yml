name: Deploy Linux Build to Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ZIP_NAME: linux-server.zip
      DEPLOY_PATH: ~/deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: 🔍 Verificar que el ZIP existe
        run: |
          if [ ! -f builds/${{ env.ZIP_NAME }} ]; then
            echo "❌ Build ZIP no encontrado en builds/${{ env.ZIP_NAME }}"
            exit 1
          fi

      - name: 📦 Subir el ZIP al servidor (SCP)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "builds/${{ env.ZIP_NAME }}"
          target: "${{ env.DEPLOY_PATH }}"

      - name: 🔁 Desplegar y reiniciar el servicio en el servidor
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "📦 Descomprimiendo el build..."
            unzip -o ${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }} -d ${{ env.DEPLOY_PATH }}/LinuxServer

            echo "🔐 Dando permisos de ejecución..."
            chmod +x ${{ env.DEPLOY_PATH }}/LinuxServer/TekenCombat2.x86_64

            echo "🚀 Reiniciando el servicio systemd..."
            sudo systemctl daemon-reload
            sudo systemctl restart tekencombat.service

            echo "✅ Despliegue completado correctamente."
