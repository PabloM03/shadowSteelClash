name: Deploy Linux Server Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ZIP_NAME: linux-server.zip
  BUILD_DIR: builds
  DEPLOY_PATH: ~/deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ Empaquetar el build SIEMPRE
      - name: Zip the build folder
        run: |
          echo "📦 Empaquetando build en ${{ env.ZIP_NAME }}"
          cd ${{ env.BUILD_DIR }}
          zip -r ../${{ env.ZIP_NAME }} ./*
          cd ..

      # ✅ Calcular checksum local
      - name: Calculate local checksum
        run: |
          sha256sum ${{ env.ZIP_NAME }} | awk '{print $1}' > local_checksum.txt

      # ✅ Obtener checksum remoto si existe
      - name: Get remote checksum
        id: get_remote_checksum
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            if [ -f "${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }}" ]; then
              sha256sum "${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }}" | awk '{print $1}' > ${{ env.DEPLOY_PATH }}/remote_checksum.txt
              cat ${{ env.DEPLOY_PATH }}/remote_checksum.txt
            else
              echo "NO_REMOTE_FILE" > ${{ env.DEPLOY_PATH }}/remote_checksum.txt
            fi

      # ✅ Descargar el checksum remoto
      - name: Download remote checksum
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "${{ env.DEPLOY_PATH }}/remote_checksum.txt"
          target: "."

      # ✅ Comparar checksums
      - name: Compare checksums
        id: compare
        run: |
          LOCAL=$(cat local_checksum.txt)
          REMOTE=$(cat remote_checksum.txt || echo "NO_REMOTE_FILE")
          echo "🔍 Local:  $LOCAL"
          echo "🔍 Remote: $REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ El build es idéntico. No se despliega."
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
            echo "🚀 El build ha cambiado. Se procederá al despliegue."
          fi

      # ✅ Subir ZIP y checksum SOLO si el ZIP ha cambiado
      - name: Upload ZIP and checksum to server
        if: steps.compare.outputs.skip_deploy == 'false'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: |
            linux-server.zip
            local_checksum.txt
          target: "${{ env.DEPLOY_PATH }}"

      # ✅ Reemplazar ZIP y reiniciar systemd solo si ha cambiado
      - name: Unzip and restart service
        if: steps.compare.outputs.skip_deploy == 'false'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "🗃️  Desempaquetando build..."
            unzip -o ${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }} -d ${{ env.DEPLOY_PATH }}/LinuxServer
            echo "🔒 Dando permisos al ejecutable..."
            chmod +x ${{ env.DEPLOY_PATH }}/LinuxServer/TekenCombat2.x86_64
            echo "🔁 Reiniciando servicio..."
            sudo systemctl restart tekencombat.service
            sudo systemctl status tekencombat.service --no-pager
