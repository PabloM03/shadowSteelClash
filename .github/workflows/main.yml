name: Deploy Unity Server (auto desde Cloud Build)

on:
  push:
    branches: [ main ]

jobs:
  fetch-build:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.get.outputs.latest }}
      download_url: ${{ steps.get.outputs.download_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtener último build exitoso
        id: get
        run: |
          set -euo pipefail
          UNITY_AUTH=$(echo -n "${{ secrets.UNITY_API_TOKEN }}:" | base64)
          builds_json=$(curl -s \
            -H "Authorization: Basic $UNITY_AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${{ secrets.ORG_ID }}/projects/${{ secrets.PROJECT_ID }}/buildtargets/${{ secrets.BUILD_TARGET }}/builds")

          latest_build=$(jq 'map(select(.buildStatus=="success")) | map(.build) | max' <<<"$builds_json")
          if [[ -z "$latest_build" || "$latest_build" == "null" ]]; then
            echo "❌ No hay builds exitosos." >&2
            exit 1
          fi
          download_url=$(jq -r \
            '.[] | select(.buildStatus=="success" and .build=='"$latest_build"') | .links.download_primary.href' \
            <<<"$builds_json")
          echo "::set-output name=latest::$latest_build"
          echo "::set-output name=download_url::$download_url"

  deploy:
    needs: fetch-build
    runs-on: [ self-hosted, windows ]
    steps:
      - name: Desplegar build en Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $latest = '${{ needs.fetch-build.outputs.latest }}'
          $url    = '${{ needs.fetch-build.outputs.download_url }}'
          $dest   = 'C:\server'

          Write-Host "� Desplegando build #$latest"
          if (Test-Path $dest) {
            Write-Host "� Limpiando $dest..."
            Remove-Item -Recurse -Force "$dest\*" 
          } else {
            Write-Host "� Creando $dest..."
            New-Item -ItemType Directory -Path $dest | Out-Null
          }

          Write-Host "⬇️  Descargando artefacto..."
          Invoke-WebRequest -Uri $url -OutFile "$dest\server.zip" -UseBasicParsing

          Write-Host "� Descomprimiendo..."
          Expand-Archive -Path "$dest\server.zip" -DestinationPath $dest -Force
          Remove-Item "$dest\server.zip"

          Write-Host "� Reiniciando servicio 'mygame-server'..."
          Restart-Service -Name mygame-server -Force

          Write-Host "✅ Despliegue completado."
