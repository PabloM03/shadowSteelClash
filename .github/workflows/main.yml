name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: windows-2019

    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
    # 0) Código
    - uses: actions/checkout@v3

    # 1) utilidades
    - name: Instalar jq
      shell: powershell
      run: choco install -y jq

    # 2) Limpia artifacts viejos
    - name: Limpiar artifacts antiguos
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $auth = $env:UNITY_API_TOKEN
        $url  = "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds"
        $all  = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Basic $auth" }

        $builds = $all | Where-Object { $_.buildStatus -eq "success" } | Select-Object -ExpandProperty build | Sort-Object
        if ($builds) {
          $latest = $builds[-1]
          foreach ($b in $builds) {
            if ($b -ne $latest) {
              Invoke-RestMethod -Method Delete `
                -Uri "$url/$b/artifacts" `
                -Headers @{ Authorization = "Basic $auth" }
            }
          }
        } else {
          Write-Host "⚠️  No hay builds 'success' todavía; no se limpian artifacts."
        }

    # 3) Obtener URL del último build SUCCESS
    - name: Obtener URL del último build
      id: get_url
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $auth = $env:UNITY_API_TOKEN
        $url  = "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds"
        $all  = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Basic $auth" }

        $latest = ($all |
          Where-Object { $_.buildStatus -eq "success" } |
          Select-Object -ExpandProperty build |
          Measure-Object -Maximum).Maximum

        if (-not $latest) {
          Write-Host "::warning::No existe ningún build con estado 'success'. Se cancela el job."
          Exit 0
        }

        $dl = ($all | Where-Object { $_.buildStatus -eq "success" -and $_.build -eq $latest }).links.download_primary.href
        Write-Host "� Enlace del build #$latest: $dl"
        "download_url=$dl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

    # 4) Ejecutar script remoto por WinRM
    - name: Desplegar y reiniciar en Windows remoto
      uses: im-open/remote-windows-machine-script-execution@v2.0.3
      with:
        server:                   ${{ secrets.SERVER_IP }}
        service-account-id:       ${{ secrets.SERVER_USER }}
        service-account-password: ${{ secrets.SERVER_PASSWORD }}
        script-path:              .github/scripts/deploy.ps1
        # entrecomillado doble escapado para que llegue como 1 solo argumento
        script-arguments:         "\"${{ steps.get_url.outputs.download_url }}\""
        split-script-arguments:   false
