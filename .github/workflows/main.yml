name: Deploy Linux Server Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ZIP_NAME: linux-server.zip
  BUILD_DIR: builds
  # Usa ruta ABSOLUTA, nada de "~"
  DEPLOY_PATH: /home/${{ secrets.SERVER_USER }}/deploy
  EXECUTABLE_PATH: /home/${{ secrets.SERVER_USER }}/deploy/LinuxServer/TekenCombat2.x86_64

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Copiar todo el build de Unity al servidor
      - name: Upload Unity build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "builds/*"
          target: "/home/${{ secrets.SERVER_USER }}/deploy"

      # Reiniciar el servicio systemd (ya configurado en el servidor)
      - name: Restart Unity service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart teken.service
