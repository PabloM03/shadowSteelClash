name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: windows-2019

    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Preparar runner (instalar jq y 7zip)
        shell: powershell
        run: choco install -y jq 7zip

      - name: Limpiar artifacts antiguos
        shell: powershell
        run: |
          # Forzar TLS1.2
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # Usar token tal cual
          $authToken = $env:UNITY_API_TOKEN

          # Llamada de prueba
          Invoke-RestMethod `
            -Uri "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID" `
            -Headers @{ Authorization = "Basic $authToken" } `
            -ErrorAction Stop | Out-Null

          # Listar builds exitosos
          $all = Invoke-RestMethod `
            -Uri "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds" `
            -Headers @{ Authorization = "Basic $authToken" }

          $builds = $all | Where-Object { $_.buildStatus -eq "success" } | Select-Object -ExpandProperty build | Sort-Object
          if (-not $builds) {
            Write-Warning "⚠️ No hay builds exitosos para limpiar."
            exit 0
          }
          $latest = $builds[-1]

          foreach ($b in $builds) {
            if ($b -ne $latest) {
              $url = "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds/$b/artifacts"
              Invoke-RestMethod -Uri $url -Method Delete -Headers @{ Authorization = "Basic $authToken" }
            }
          }

      - name: Descargar y descomprimir último build
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $authToken = $env:UNITY_API_TOKEN

          # Obtener número del build más reciente
          $all = Invoke-RestMethod `
            -Uri "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds" `
            -Headers @{ Authorization = "Basic $authToken" }
          $latest = ($all | Where-Object { $_.buildStatus -eq "success" } | Select-Object -ExpandProperty build | Measure-Object -Maximum).Maximum

          # Extraer URL de descarga
          $dl = ($all | Where-Object { $_.buildStatus -eq "success" -and $_.build -eq $latest }).links.download_primary.href

          # Preparar workspace
          Remove-Item -Recurse -Force build, servidor.zip -ErrorAction Ignore
          New-Item -ItemType Directory -Path build | Out-Null

          # Descargar y descomprimir
          Invoke-WebRequest -Uri $dl -OutFile servidor.zip
          Expand-Archive -Path servidor.zip -DestinationPath build -Force

      - name: Desplegar y reiniciar servicio en Windows remoto
        uses: im-open/remote-windows-machine-script-execution@v2.0.3
        with:
          server:                   ${{ secrets.SERVER_IP }}
          service-account-id:       ${{ secrets.SERVER_USER }}
          service-account-password: ${{ secrets.SERVER_PASSWORD }}
          script-path:              .github/scripts/deploy.ps1
