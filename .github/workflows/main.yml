name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: windows-latest

    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Preparar runner (instalar jq y 7zip)
        run: choco install -y jq 7zip
        shell: powershell

      - name: Limpiar artifacts antiguos
        shell: powershell
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$env:UNITY_API_TOKEN:"))
          Write-Host "� Listando builds exitosos..."
          $all = Invoke-RestMethod `
            -Uri "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds" `
            -Headers @{ Authorization = "Basic $auth" }

          $builds = $all | Where-Object { $_.buildStatus -eq "success" } | Select-Object -ExpandProperty build | Sort-Object
          if (-not $builds) {
            Write-Warning "⚠️ No hay builds exitosos para limpiar."
            exit 0
          }

          $latest = $builds[-1]
          Write-Host "✔ Último build exitoso: #$latest"

          foreach ($num in $builds) {
            if ($num -ne $latest) {
              $url = "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds/$num/artifacts"
              Write-Host "� Borrando artifacts del build #$num → DELETE $url"
              Invoke-RestMethod -Uri $url -Method Delete -Headers @{ Authorization = "Basic $auth" }
            }
          }

      - name: Descargar último build exitoso
        shell: powershell
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$env:UNITY_API_TOKEN:"))
          Write-Host "� Volviendo a listar builds..."
          $all = Invoke-RestMethod `
            -Uri "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds" `
            -Headers @{ Authorization = "Basic $auth" }

          $latest = ($all | Where-Object { $_.buildStatus -eq "success" } | Select-Object -ExpandProperty build | Measure-Object -Maximum).Maximum
          Write-Host "✔ Build exitoso más reciente: #$latest"

          $downloadUrl = ($all | Where-Object { $_.buildStatus -eq "success" -and $_.build -eq $latest }).links.download_primary.href
          if (-not $downloadUrl) {
            Write-Error "❌ No se pudo extraer la URL de descarga."
            exit 1
          }

          Write-Host "⬇ URL de descarga: $downloadUrl"
          Remove-Item -Path build, servidor.zip -Recurse -Force -ErrorAction Ignore
          New-Item -ItemType Directory -Path build | Out-Null

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $downloadUrl -OutFile servidor.zip

          Expand-Archive -Path servidor.zip -DestinationPath build -Force

      - name: Desplegar y reiniciar servicio en Windows remoto
        uses: im-open/remote-windows-machine-script-execution@v1.1.0
        with:
          server:                   ${{ secrets.SERVER_IP }}
          service-account-id:       ${{ secrets.SERVER_USER }}
          service-account-password: ${{ secrets.SERVER_PASSWORD }}
          script-path:              .github/scripts/deploy.ps1
