name: Deploy Linux Server Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ZIP_NAME: linux-server.zip
  BUILD_DIR: builds
  DEPLOY_PATH: ~/deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ✅ Empaquetar el build SIEMPRE
      - name: Zip the build folder
        run: |
          echo "📦 Empaquetando build en ${{ env.ZIP_NAME }}"
          cd ${{ env.BUILD_DIR }}
          zip -r ../${{ env.ZIP_NAME }} ./*
          cd ..

      # ✅ Calcular checksum local
      - name: Calculate local checksum
        id: checksum
        run: |
          sha256sum ${{ env.ZIP_NAME }} | awk '{print $1}' > local_checksum.txt
          echo "LOCAL_SUM=$(cat local_checksum.txt)" >> $GITHUB_ENV

      # ✅ Obtener checksum remoto (si existe)
      - name: Get remote checksum
        id: remote_check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            if [ -f "${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }}" ]; then
              sha256sum "${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }}" | awk '{print $1}' > remote_checksum.txt
              cat remote_checksum.txt
            else
              echo "NO_REMOTE_FILE" > remote_checksum.txt
            fi
          script_stop: false

      # ✅ Descargar el checksum remoto
      - name: Download remote checksum
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "${{ env.DEPLOY_PATH }}/remote_checksum.txt"
          target: "."

      # ✅ Comparar checksums y decidir si subir o no
      - name: Compare checksums
        id: compare
        run: |
          LOCAL=$(cat local_checksum.txt)
          REMOTE=$(cat remote_checksum.txt || echo "NO_REMOTE_FILE")
          echo "🔍 Local:  $LOCAL"
          echo "🔍 Remote: $REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ El build es idéntico al del servidor. No se subirá."
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
            echo "🚀 El build es diferente. Procediendo al despliegue..."
          fi

      # ✅ Subir solo si el build ha cambiado
      - name: Upload ZIP to server via SCP
        if: steps.compare.outputs.skip_deploy == 'false'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "${{ env.ZIP_NAME }}"
          target: "${{ env.DEPLOY_PATH }}"

      # ✅ Descomprimir y reiniciar systemd solo si el build ha cambiado
      - name: Unzip and restart systemd service
        if: steps.compare.outputs.skip_deploy == 'false'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "📂 Descomprimiendo build en ${{ env.DEPLOY_PATH }}/LinuxServer..."
            unzip -o ${{ env.DEPLOY_PATH }}/${{ env.ZIP_NAME }} -d ${{ env.DEPLOY_PATH }}/LinuxServer
            echo "🔒 Asignando permisos al ejecutable..."
            chmod +x ${{ env.DEPLOY_PATH }}/LinuxServer/TekenCombat2.x86_64
            echo "🔁 Reiniciando servicio..."
            sudo systemctl restart tekencombat.service
            sudo systemctl status tekencombat.service --no-pager
