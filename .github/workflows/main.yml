name: Deploy Unity Server (auto desde Cloud Build)

on:
  # Disparado por Cloud Build al terminar con éxito
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: windows-2019

    # Variables comunes
    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
    # 0) Código fuente
    - uses: actions/checkout@v3

    # 1) jq para parsear JSON en Bash
    - name: Ensure jq
      run: choco install jq -y --no-progress
      shell: powershell

    # 2) Mantener sólo el último build SUCCESS en Cloud Build
    - name: Clean Cloud-Build artifacts
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $api  = "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds"
        $all  = Invoke-RestMethod -Uri $api -Headers @{Authorization="Basic $env:UNITY_API_TOKEN"}

        # IDs de builds con éxito
        $succ = $all |
                Where-Object buildStatus -eq success |
                ForEach-Object build |
                Sort-Object

        if ($succ) {
          $latest = $succ[-1]         # último build correcto
          $succ | Where-Object { $_ -ne $latest } |
            ForEach-Object {
              Invoke-RestMethod -Method Delete `
                                -Uri "$api/$_/artifacts" `
                                -Headers @{Authorization="Basic $env:UNITY_API_TOKEN"}
            }
        }

    # 3) Obtener la URL del último build SUCCESS
    - name: Get last build URL
      id: url
      shell: bash
      env:
        UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
        ORG_ID:          ${{ secrets.ORG_ID }}
        PROJECT_ID:      ${{ secrets.PROJECT_ID }}
        BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
      run: |
        set -euo pipefail
        API="https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds"
        JSON=$(curl -s -H "Authorization: Basic ${UNITY_API_TOKEN}" "$API")

        LAST=$(echo "$JSON" | jq 'map(select(.buildStatus=="success")) | max_by(.build) | .build')
        [ "$LAST" = "null" ] && { echo "::warning::No successful build."; exit 0; }

        DL=$(echo "$JSON" | jq -r --arg n "$LAST" \
             '.[] | select(.buildStatus=="success" and (.build|tostring)==$n) | .links.download_primary.href')

        echo "download_url=$DL" >> "$GITHUB_OUTPUT"
        echo "✔ build #$LAST → $DL"

    # 4) Copiar deploy.ps1 al servidor y ejecutarlo por WinRM
    - name: Deploy & restart on Windows via WinRM
      shell: powershell
      env:
        SERVER_IP:       ${{ secrets.SERVER_IP }}
        SERVER_USER:     ${{ secrets.SERVER_USER }}
        SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        DOWNLOAD_URL:    ${{ steps.url.outputs.download_url }}
      run: |
        $ErrorActionPreference = 'Stop'   # Falla al primer error

        # --- Credenciales ---
        $sec  = ConvertTo-SecureString $env:SERVER_PASSWORD -AsPlainText -Force
        $cred = [pscredential]::new($env:SERVER_USER, $sec)

        # --- Sesión WinRM ---
        $opt  = New-PSSessionOption -SkipCNCheck -SkipCACheck
        $sess = New-PSSession -ComputerName $env:SERVER_IP `
                              -Credential  $cred `
                              -Authentication Basic `
                              -UseSSL `
                              -SessionOption $opt

        # --- Rutas ---
        $remoteDir    = 'C:\Deploy'
        $remoteScript = Join-Path $remoteDir 'deploy.ps1'
        $localScript  = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/deploy.ps1'

        # --- Validar script local ---
        if (-not (Test-Path $localScript)) {
          throw "Script local no encontrado: $localScript"
        }

        # --- Asegurar carpeta destino ---
        Invoke-Command -Session $sess -ScriptBlock {
          param($dir)
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
        } -ArgumentList $remoteDir

        # --- Copiar ---
        Copy-Item -Path $localScript `
                  -Destination $remoteScript `
                  -ToSession   $sess `
                  -Force `
                  -Verbose

        # --- Verificar copia ---
        $exists = Invoke-Command -Session $sess -ScriptBlock { param($p) Test-Path $p } -ArgumentList $remoteScript
        if (-not $exists) {
          throw "La copia falló: $remoteScript no existe en el servidor."
        }

        # --- Ejecutar ---
        Invoke-Command -Session $sess `
                      -FilePath  $remoteScript `
                      -ArgumentList $env:DOWNLOAD_URL

        # --- Cerrar ---
        Remove-PSSession $sess

