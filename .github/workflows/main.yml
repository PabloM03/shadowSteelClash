name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
      # ────────────────────────────────────────────────────────────────
      # PRE: instalar jq (es posible que unzip ya esté presente)
      - name: Preparar runner (instalar jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # ────────────────────────────────────────────────────────────────
      # 1) Limpiar artefactos de builds antiguos
      - name: Limpiar artefactos de builds exitosos antiguos en Unity Cloud Build
        env:
          UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
          ORG_ID:          ${{ secrets.ORG_ID }}
          PROJECT_ID:      ${{ secrets.PROJECT_ID }}
          BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UNITY_API_TOKEN" | base64)
          builds=$(curl -s \
            -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds" \
            | jq -r '.[] | select(.buildStatus=="success") | .build' | sort -n)

          if [[ -z "$builds" ]]; then
            echo "⚠️  No hay builds exitosos para limpiar."
            exit 0
          fi

          latest=$(echo "$builds" | tail -1)
          echo "✔ Último build exitoso: #$latest"

          for num in $builds; do
            if [[ "$num" -ne "$latest" ]]; then
              echo "�  Borrando artefactos del build #$num..."
              curl -s -X DELETE \
                -H "Authorization: Basic $AUTH" \
                "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds/${num}/artifacts"
            fi
          done

      # ────────────────────────────────────────────────────────────────
      # 2) Descargar el último build exitoso
      - name: Descargar build de Unity Cloud
        env:
          UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
          ORG_ID:          ${{ secrets.ORG_ID }}
          PROJECT_ID:      ${{ secrets.PROJECT_ID }}
          BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UNITY_API_TOKEN" | base64)

          # 2a) Repetir POST para renovar el share y obtener shareid
          shareid=$(curl -s -X POST \
            -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds/latest/share" \
            | jq -r '.shareid')

          if [[ -z "$shareid" || "$shareid" == "null" ]]; then
            echo "❌ ERROR al crear share: $(curl -s -H "Authorization: Basic $AUTH" "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds/latest/share")"
            exit 1
          fi

          # 2b) Construir la URL pública
          share_url="https://cloud.unity.com/public-share/build-automation/share?shareId=${shareid}"
          echo "✅ Share URL: $share_url"

          # 2c) Descarga y desempaqueta
          rm -rf build/ servidor.zip
          mkdir -p build
          echo "⬇️  Descargando artefacto..."
          curl -sL "$share_url" -o servidor.zip
          echo "� Descomprimiendo..."
          unzip -o servidor.zip -d build/

      # ────────────────────────────────────────────────────────────────
      # 3) Limpiar carpeta remota en el VPS
      - name: Limpiar build anterior en el VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /home/${{ secrets.SERVER_USER }}/server/*

      # ────────────────────────────────────────────────────────────────
      # 4) Subir el build nuevo al VPS
      - name: Subir build al VPS
        uses: appleboy/scp-action@v0.1.5
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   "build/**"
          target:   "/home/${{ secrets.SERVER_USER }}/server"

      # ────────────────────────────────────────────────────────────────
      # 5) Reiniciar el servicio remoto
      - name: Reiniciar servicio
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart mygame-server
            echo "✅ Servicio reiniciado."
