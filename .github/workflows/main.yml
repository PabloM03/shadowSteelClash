name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: windows-2019

    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
    # 0) Checkout
    - uses: actions/checkout@v3

    # 1) Instalar jq (si ya está, no rompe)
    - name: Ensure jq is present
      shell: powershell
      run: choco install -y jq || choco upgrade -y jq

    # 2) Limpiar artifacts antiguos (mantiene solo el último éxito)
    - name: Clean old artifacts
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $auth = $env:UNITY_API_TOKEN
        $api  = "https://build-api.cloud.unity3d.com/api/v1/orgs/$env:ORG_ID/projects/$env:PROJECT_ID/buildtargets/$env:BUILD_TARGET/builds"
        $all  = Invoke-RestMethod -Uri $api -Headers @{ Authorization = "Basic $auth" }

        $succ = $all | Where-Object { $_.buildStatus -eq "success" } | ForEach-Object { $_.build } | Sort-Object
        if ($succ) {
          $latest = $succ[-1]
          foreach ($b in $succ) {
            if ($b -ne $latest) {
              Invoke-RestMethod -Method Delete -Uri "$api/$b/artifacts" -Headers @{ Authorization = "Basic $auth" }
            }
          }
        } else {
          Write-Host "⚠️ No hay builds 'success' para limpiar."
        }

    # 3) Obtener URL del último build SUCCESS
    - name: Get last build URL
      id: get_url
      shell: bash
      env:
        UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
        ORG_ID:          ${{ secrets.ORG_ID }}
        PROJECT_ID:      ${{ secrets.PROJECT_ID }}
        BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
      run: |
        set -euo pipefail
        API="https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds"
        JSON=$(curl -s -H "Authorization: Basic ${UNITY_API_TOKEN}" "$API")
        LATEST=$(echo "$JSON" | jq 'map(select(.buildStatus=="success")) | max_by(.build) | .build')
        if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
          echo "::warning::No build success yet."
          exit 0
        fi
        DL=$(echo "$JSON" | jq -r --arg num "$LATEST" '.[] | select(.buildStatus=="success" and (.build|tostring)==$num) | .links.download_primary.href')
        echo "download_url=$DL" >> "$GITHUB_OUTPUT"
        echo "ℹ️  build #$LATEST → $DL"

    # 4) Copiar y ejecutar deploy.ps1 en el servidor (WinRM)
    - name: Deploy & restart on Windows
      uses: im-open/remote-windows-machine-script-execution@v2.0.3
      with:
        server:                   ${{ secrets.SERVER_IP }}
        service-account-id:       ${{ secrets.SERVER_USER }}
        service-account-password: ${{ secrets.SERVER_PASSWORD }}
        script-path:              .github/scripts/deploy.ps1
        pass-thru-env:            DOWNLOAD_URL
      env:
        DOWNLOAD_URL: ${{ steps.get_url.outputs.download_url }}
