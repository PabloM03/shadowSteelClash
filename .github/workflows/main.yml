name: Deploy Unity Build

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Subir build al servidor en carpeta temporal
      - name: Upload Unity build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "builds/*"
          target: "/home/${{ secrets.SERVER_USER }}/deploy"

      # Mover build a la carpeta del servicio y reiniciar
      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl stop tekencombat.service || true
            rm -rf /home/${{ secrets.SERVER_USER }}/tekencombat/*
            cp -r /home/${{ secrets.SERVER_USER }}/deploy/* /home/${{ secrets.SERVER_USER }}/tekencombat/
            sudo systemctl daemon-reload
            sudo systemctl start tekencombat.service
