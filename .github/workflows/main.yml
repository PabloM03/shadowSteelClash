name: Deploy Linux Server Build

on:
  push:
    branches:
      - main
    paths:
      - 'builds/**'
  workflow_dispatch:

env:
  BUILD_DIR: builds
  SERVICE_PATH: /home/${{ secrets.SERVER_USER }}/tekencombat
  EXECUTABLE: TekenCombat2.x86_64

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # La VM tiene 952 MB. Subir el build (~35 MB) mientras el servidor sigue
      # corriendo y ocupando ~250 MB la deja sin margen: el 2026-09-06 se colgo
      # justo durante un despliegue. Pararlo antes libera esa memoria y ademas
      # evita sobrescribir ficheros de un proceso vivo.
      - name: Stop Unity service before upload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: sudo systemctl stop tekencombat.service || true

      # Subir SOLO contenido de builds/, no la carpeta builds entera
      - name: Upload Unity build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.BUILD_DIR }}/**"
          target: "${{ env.SERVICE_PATH }}"
          strip_components: 1
          exclude: |
            ${{ env.BUILD_DIR }}/builds/**
            ${{ env.BUILD_DIR }}/**/*.log
            ${{ env.BUILD_DIR }}/**/*.pdb

      # Dar permisos y reiniciar el servicio
      - name: Restart Unity service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ls -l ${{ env.SERVICE_PATH }}
            sudo chmod +x ${{ env.SERVICE_PATH }}/${{ env.EXECUTABLE }}

            # Vaciar log
            LOG_FILE="/home/${{ secrets.SERVER_USER }}/tekencombat/server.log"
            sudo mkdir -p "$(dirname "$LOG_FILE")"
            sudo touch "$LOG_FILE"
            sudo truncate -s 0 "$LOG_FILE"
            echo "Log vaciado: $LOG_FILE"

            sudo systemctl daemon-reload
            sudo systemctl restart tekencombat.service
            sudo systemctl status --no-pager tekencombat.service
