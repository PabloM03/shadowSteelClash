name: Build and Deploy Unity Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BUILD_FOLDER: Build/LinuxServer
      BUILD_NAME: TekenCombat2.x86_64
      ZIP_NAME: linux-server.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Unity Docker Image
        run: docker pull ghcr.io/${{ github.repository_owner }}/unity-build:latest

      - name: Activate Unity License
        run: |
          docker run --rm \
            -e UNITY_EMAIL=${{ secrets.UNITY_EMAIL }} \
            -e UNITY_PASSWORD=${{ secrets.UNITY_PASSWORD }} \
            ghcr.io/${{ github.repository_owner }}/unity-build:latest \
            -batchmode -nographics -quit \
            -logFile /dev/stdout \
            -username $UNITY_EMAIL \
            -password $UNITY_PASSWORD

      - name: Build Unity Project
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ghcr.io/${{ github.repository_owner }}/unity-build:latest \
            -batchmode -nographics -quit \
            -projectPath /workspace \
            -executeMethod BuildServer.BuildLinuxServer

      - name: Set execute permission for Linux binary
        run: |
          chmod +x "${{ env.BUILD_FOLDER }}/${{ env.BUILD_NAME }}"

      - name: Zip the Build
        run: |
          cd ${{ env.BUILD_FOLDER }}/.. && \
          zip -r ${{ env.ZIP_NAME }} LinuxServer
          mkdir -p ${{ github.workspace }}/builds
          mv ${{ env.ZIP_NAME }} ${{ github.workspace }}/builds/

      - name: Upload Build to Server via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "builds/linux-server.zip"
          target: "~/deploy"

      - name: Restart Systemd Service on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            unzip -o ~/deploy/linux-server.zip -d ~/deploy/LinuxServer
            chmod +x ~/deploy/LinuxServer/${{ env.BUILD_NAME }}
            sudo systemctl restart tekencombat.service

      - name: Return Unity License
        if: always()
        run: |
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/unity-build:latest \
            -returnlicense
