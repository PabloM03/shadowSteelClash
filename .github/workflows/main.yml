name: Deploy Unity Server (auto desde Cloud Build)

on:
  push:
    branches: [ main ]

jobs:
  deploy-server:
    runs-on: [ self-hosted, windows ]

    env:
      UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
      ORG_ID:          ${{ secrets.ORG_ID }}
      PROJECT_ID:      ${{ secrets.PROJECT_ID }}
      BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}

    steps:
      # 1) Obtener info del último build exitoso
      - name: Obtener último build exitoso
        id: fetch_build
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UNITY_API_TOKEN" | base64)
          echo "� Listando builds exitosos..."
          builds_json=$(curl -s -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds")

          latest=$(jq 'map(select(.buildStatus=="success")) | max_by(.build) | .build' <<<"$builds_json")
          download_url=$(jq -r \
            '.[] | select(.buildStatus=="success" and .build == '"$latest"') | .links.download_primary.href' \
            <<<"$builds_json")

          echo "✔ Build exitoso más reciente: #$latest"
          echo "LATEST=$latest"           >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$download_url" >> $GITHUB_ENV

      # 2) Desplegar en self-hosted Windows runner
      - name: Desplegar en Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = $Env:LATEST
          $url    = $Env:DOWNLOAD_URL
          $dest   = 'C:\server'

          Write-Host "� Desplegando build #$latest"
          if (Test-Path $dest) {
            Write-Host "� Limpiando carpeta $dest..."
            Remove-Item -Recurse -Force "$dest\*" 
          } else {
            Write-Host "� Creando carpeta $dest..."
            New-Item -ItemType Directory -Path $dest | Out-Null
          }

          Write-Host "⬇️  Descargando artefacto..."
          Invoke-WebRequest -Uri $url -OutFile "$dest\server.zip"

          Write-Host "� Descomprimiendo..."
          Expand-Archive -Path "$dest\server.zip" -DestinationPath $dest -Force
          Remove-Item "$dest\server.zip"

          Write-Host "� Reiniciando servicio 'mygame-server'..."
          Restart-Service -Name mygame-server -Force

          Write-Host "✅ Despliegue completado."
