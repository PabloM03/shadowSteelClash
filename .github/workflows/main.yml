name: Deploy Unity Server (auto desde Cloud Build)

on:
  repository_dispatch:
    types: [unity-build-complete]

jobs:
  deploy-server:
    runs-on: ubuntu-latest

    steps:
      # 0) Prepara el runner
      - name: Preparar runner (instalar jq y unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # 1) Limpiar artifacts de builds exitosos antiguos
      - name: Limpiar artifacts de builds exitosos antiguos
        env:
          UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
          ORG_ID:          ${{ secrets.ORG_ID }}
          PROJECT_ID:      ${{ secrets.PROJECT_ID }}
          BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UNITY_API_TOKEN" | base64)

          echo "� Listando builds exitosos..."
          all_builds=$(curl -s -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds")

          builds=$(jq -r 'map(select(.buildStatus=="success")) | map(.build) | sort' <<<"$all_builds")
          if [[ -z "$builds" ]]; then
            echo "⚠️  No hay builds exitosos para limpiar."
            exit 0
          fi

          latest=$(echo "$builds" | tail -1)
          echo "✔ Último build exitoso: #$latest"

          for num in $builds; do
            if [[ "$num" -ne "$latest" ]]; then
              url="https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds/${num}/artifacts"
              echo "�️  Borrando artifacts del build #$num → DELETE ${url}"
              curl -s -X DELETE \
                -H "Authorization: Basic $AUTH" \
                "$url"
            fi
          done

      # 2) Descargar el último build exitoso
      - name: Descargar último build exitoso
        env:
          UNITY_API_TOKEN: ${{ secrets.UNITY_API_TOKEN }}
          ORG_ID:          ${{ secrets.ORG_ID }}
          PROJECT_ID:      ${{ secrets.PROJECT_ID }}
          BUILD_TARGET:    ${{ secrets.BUILD_TARGET }}
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:' "$UNITY_API_TOKEN" | base64)

          echo "� Volviendo a listar builds exitosos para extraer URL..."
          all_builds=$(curl -s -H "Authorization: Basic $AUTH" \
            "https://build-api.cloud.unity3d.com/api/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/buildtargets/${BUILD_TARGET}/builds")

          latest=$(jq 'map(select(.buildStatus=="success")) | map(.build) | max' <<<"$all_builds")
          echo "✔ Build exitoso más reciente: #$latest"

          download_url=$(jq -r \
            '.[] | select(.buildStatus=="success" and .build == '"$latest"') | .links.download_primary.href' \
            <<<"$all_builds")

          if [[ -z "$download_url" || "$download_url" == "null" ]]; then
            echo "❌ No se pudo extraer la URL de descarga." >&2
            exit 1
          fi

          echo "⬇️  URL de descarga: $download_url"
          echo "� Limpiando workspace local..."
          rm -rf build servidor.zip
          mkdir -p build

          echo "⬇️  Descargando artefacto..."
          curl -sL "$download_url" -o servidor.zip

          echo "� Descomprimiendo en ./build/..."
          unzip -o servidor.zip -d build/

      # 3) Limpiar carpeta remota en el VPS
      - name: Limpiar carpeta remota en VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /home/${{ secrets.SERVER_USER }}/server/*

      # 4) Subir el nuevo build al VPS
      - name: Subir build al VPS
        uses: appleboy/scp-action@v0.1.5
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   "build/**"
          target:   "/home/${{ secrets.SERVER_USER }}/server"

      # 5) Reiniciar el servicio remoto
      - name: Reiniciar servicio
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart mygame-server
            echo "✅ Servicio reiniciado."
